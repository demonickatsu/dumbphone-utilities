<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CNN United States</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<ul id="feed"></ul>
<script>
fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('http://rss.cnn.com/rss/cnn_us.rss'))
  .then(r => r.json())
  .then(data => {
    const feed = document.getElementById('feed');
    data.items.forEach(item => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = 'https://www.textise.net/showText.aspx?strURL=' + encodeURIComponent(item.link);
      a.textContent = item.title;
      li.appendChild(a);
      feed.appendChild(li);
    });
  })
  .catch(e => document.getElementById('feed').textContent = 'Error: ' + e.message);
</script>
</body>
<a href="/index.html">Back home</a>
</html>
